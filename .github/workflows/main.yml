name: Compilar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Buildozer y dependencias
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade buildozer cython

      - name: Compilar APK con Buildozer
        run: buildozer -v android debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: MiAsistente-APK
          path: bin/*.apk
          
